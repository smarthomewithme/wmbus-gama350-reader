# EXAMPLE ONLY — create secrets.yaml and replace EVERY placeholder.
# NEVER commit your real secrets.yaml or publish real meter IDs and AES keys.
# Generate a unique 32-byte Base64 API key in ESPHome.
wifi_ssid: "REPLACE_WITH_YOUR_WIFI_SSID"
wifi_password: "REPLACE_WITH_YOUR_WIFI_PASSWORD"
api_encryption_key: "REPLACE_WITH_NEW_32_BYTE_BASE64_API_KEY"
ota_password: "REPLACE_WITH_NEW_UNIQUE_OTA_PASSWORD"
fallback_ap_password: "REPLACE_WITH_NEW_UNIQUE_AP_PASSWORD"
web_username: "REPLACE_WITH_WEB_USERNAME"
web_password: "REPLACE_WITH_NEW_UNIQUE_WEB_PASSWORD"

# Replace the dummy IDs with the identifiers of YOUR meters.
apator_meter_id: 0x12345678
gama350_meter_id: 0x87654321

# Each meter key is a 16-byte (32-hex-character) value from its provider.
apator_aes_key: "REPLACE_WITH_32_HEX_CHARACTERS"
gama350_aes_key: "REPLACE_WITH_32_HEX_CHARACTERS"

