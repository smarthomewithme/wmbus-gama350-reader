name: Validate ESPHome GAMA350 CC1101 example (no flash)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v49-example:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify stable branch reference and no hardcoded private settings
        run: |
          python - <<'PY'
          from pathlib import Path
          yml = Path('config/wmbus-gama350.yaml').read_text(encoding='utf-8')
          assert 'github://smarthomewithme/wmbus-gama350-reader@experiment/v4.9-stable-marcstate-eof' in yml
          assert 'frequency: 868.970 MHz' in yml
          assert 'type: amiplus' in yml and 'type: apatorna1' in yml
          for required in (
              'wifi_ssid', 'wifi_password', 'api_encryption_key', 'ota_password',
              'fallback_ap_password', 'web_username', 'web_password',
              'apator_meter_id', 'gama350_meter_id', 'apator_aes_key',
              'gama350_aes_key'
          ):
              assert '!secret ' + required in yml, required
          assert 'config/secrets.yaml' not in [
              line.strip() for line in Path('.gitignore').read_text().splitlines()
              if line.startswith('!')
          ]
          assert 'README.pl.md' not in Path('README.md').read_text()
          PY

      - name: Run native regression tests (no hardware)
        run: bash scripts/test.sh

      - name: Generate synthetic CI secrets only
        run: |
          python - <<'PY'
          import base64
          import secrets
          from pathlib import Path

          values = {
              'wifi_ssid': 'CI-EXAMPLE-NO-HARDWARE',
              'wifi_password': secrets.token_urlsafe(24),
              'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode('ascii'),
              'ota_password': secrets.token_urlsafe(24),
              'fallback_ap_password': secrets.token_urlsafe(24),
              'web_username': 'ci_example_user',
              'web_password': secrets.token_urlsafe(24),
              'apator_meter_id': '0x12345678',
              'gama350_meter_id': '0x87654321',
              'apator_aes_key': secrets.token_hex(16),
              'gama350_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(
              ''.join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding='utf-8',
          )
          PY

      - name: Install validated ESPHome version
        run: python -m pip install 'esphome==2026.10.1'

      - name: Validate full public YAML with stable v4.9 components
        run: esphome config config/wmbus-gama350.yaml

      - name: Compile example firmware (CI only, no OTA, no hardware)
        run: esphome compile config/wmbus-gama350.yaml
