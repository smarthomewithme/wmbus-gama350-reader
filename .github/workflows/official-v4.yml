name: Official CC1101 v4 validation (no flash)
on:
  push:
    branches: [release/v4-radio-diagnostics, experiment/v4.4-stale-irq-clear, experiment/v4.5-isr-woken-init, experiment/v4.9-stable-marcstate-eof, experiment/v4.10-five-minute-rx-diag, experiment/v4.11-rxbytes65-prefetch, experiment/v4.12-overflow-fastpath, experiment/v4.13-progress-poll, experiment/v4.14-prealloc-irq, experiment/v4.15-fast-unstable-retry, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run native regression tests
        run: bash scripts/test.sh
      - name: Prepare pinned upstream plus fourteen patches (v4.9-v4.15)
        run: bash scripts/prepare_cc1101_v4.sh
      - name: Verify release integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('vendor/cc1101_v4/components')
          driver = (src/'wmbus_radio/transceiver_cc1101.cpp').read_text()
          radio = (src/'wmbus_radio/component.cpp').read_text()
          hdr = (src/'wmbus_radio/component.h').read_text()
          meter = (src/'wmbus_meter/wmbus_meter.cpp').read_text()
          assert driver.count('this->write_register(CC1101_MDMCFG4, 0x5C);') == 1
          assert '0x6C' not in driver.split('CC1101_MDMCFG4, ')[1][:5]
          assert driver.count('this->write_register(CC1101_FIFOTHR, 0x03);') == 1
          assert 'this->write_register(CC1101_FIFOTHR, 0x07);' not in driver
          assert 'SHWM v4.1 FIFO16 experiment' in driver
          assert 'RF_DIAG bytes=' in driver
          assert 'SHWM v4.9 MARCSTATE EOF confirmation' in driver
          assert 'confirm_marcstate_eof(' in driver
          assert 'rx_fifo_count_plausible(available)' in driver
          assert 'rx_fifo_incomplete_read(' in driver
          assert 'rx_fifo_complete_read(' in driver
          assert 'rx_should_probe_marcstate(' in driver
          assert 'rx_should_backoff_after_drain(made_progress)' in driver
          assert 'rx_should_backoff_after_unstable(offset, length)' in driver
          assert 'SHWM v4.15 retry unstable RXBYTES immediately for long payloads.' in driver
          assert 'SHWM v4.13 post-drain polling' in driver
          assert 'SHWM v4.12 RX FIFO overflow' in driver
          assert 'SHWM wMBus v4.12 ACTIVE' in radio
          assert 'SHWM wMBus v4.13 ACTIVE' in radio
          assert 'SHWM wMBus v4.14 ACTIVE' in radio
          assert 'SHWM wMBus v4.15 ACTIVE' in radio
          method = radio.split('void Radio::receive_frame() {',1)[1].split('void Radio::receiver_task(',1)[0]
          assert method.count('std::make_unique<Packet>()') == 1
          assert method.index('std::make_unique<Packet>()') < method.index('ulTaskNotifyTake(') < method.index('read_in_task(')
          assert 'SHWM v4.12 RX_DIAG_1M' in radio
          assert 'inline constexpr bool rx_should_probe_marcstate(' in (src/'wmbus_radio/cc1101_fifo.h').read_text()
          assert 'inline constexpr bool rx_should_backoff_after_drain(' in (src/'wmbus_radio/cc1101_fifo.h').read_text()
          assert 'inline constexpr bool rx_should_backoff_after_unstable(' in (src/'wmbus_radio/cc1101_fifo.h').read_text()
          unstable = driver.split('if (!stable_rxbytes(rxbytes_raw)) {',1)[1].split('if (rxbytes_raw & 0x80)',1)[0]
          assert unstable.count('delayMicroseconds(100)') == 1
          assert unstable.index('rx_should_backoff_after_unstable(offset, length)') < unstable.index('delayMicroseconds(100)')
          assert 'kCc1101MaxReportedRxBytes = 65' in (src/'wmbus_radio/cc1101_fifo.h').read_text()
          assert 'inline bool confirm_marcstate_eof(' in (src/'wmbus_radio/cc1101_fifo.h').read_text()
          assert 'unstable_rxbytes=' in driver
          assert 'RX_DIAG cumulative' in radio
          assert 'SHWM v4.10 RX_DIAG_5M' in radio
          assert 'frame_conversion_failed_.fetch_add(1, std::memory_order_relaxed);' in radio
          assert 'frame_converted_.fetch_add(1, std::memory_order_relaxed);' in radio
          assert 'frame_conversion_failed_' in hdr
          assert 'frame_converted_' in hdr
          assert 'inline RxDiagSnapshot rx_diag_delta(' in (src/'wmbus_radio/rx_diag_window.h').read_text()
          marker = '// SHWM v4.4 stale IRQ clear'
          drain = '(void) ulTaskNotifyTake(pdTRUE, 0);'
          rearm = '// Re-arm sync word detector for next packet'
          assert radio.count(marker) == 1
          assert radio.count(drain) == 1
          assert radio.index('packet->set_rssi(this->radio->get_rssi());') < radio.index(marker) < radio.index(drain) < radio.index(rearm)
          assert 'void Radio::wakeup_receiver_task_from_isr(TaskHandle_t *arg)' in radio
          assert 'vTaskNotifyGiveFromISR(*arg, &xHigherPriorityTaskWoken);' in radio
          assert radio.count('BaseType_t xHigherPriorityTaskWoken = pdFALSE;') == 1
          assert 'BaseType_t xHigherPriorityTaskWoken;' not in radio
          for field in ('headers_failed_', 'payloads_failed_', 'long_radio_frames_'):
              assert field in hdr and field in radio
          assert 'Key: [REDACTED]' in meter
          assert 'Key: %s' not in meter
          assert 'std::string key = this->get_key();' not in meter
          PY
          git -C vendor/cc1101_v4 diff --check
      - name: Test bounded MARCSTATE end-of-frame confirmation (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v49_marcstate_eof.cpp -o /tmp/shwm-v49-marcstate-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v49-marcstate-test
      - name: Test v4.10 diagnostic deltas (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v410_rxdiag_window.cpp -o /tmp/shwm-v410-rxdiag-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v410-rxdiag-test
      - name: Test v4.11 65-byte prefetch boundary (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v411_fifo_prefetch.cpp -o /tmp/shwm-v411-fifo-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v411-fifo-test
      - name: Test v4.12 MARCSTATE scheduling policy (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v412_receive_policy.cpp -o /tmp/shwm-v412-receive-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v412-receive-test
      - name: Test v4.13 progress-only RX polling (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v413_receive_backoff.cpp -o /tmp/shwm-v413-progress-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v413-progress-test
      - name: Test v4.15 long-payload unstable RXBYTES retry (native ASan/UBSan)
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I vendor/cc1101_v4/components/wmbus_radio \
            tests/v415_unstable_retry.cpp -o /tmp/shwm-v415-retry-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/shwm-v415-retry-test
      - name: Generate isolated CI config and synthetic secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, secrets
          s = Path('config/wmbus-gama350.yaml').read_text()
          old = '../vendor/upstream/components'
          assert s.count(old) == 1
          Path('config/wmbus-gama350-v4.yaml').write_text(
              s.replace(old, '../vendor/cc1101_v4/components')
          )
          keys = {
              'wifi_ssid': 'CI-NO-RADIO',
              'wifi_password': secrets.token_urlsafe(24),
              'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode(),
              'ota_password': secrets.token_urlsafe(24),
              'gama350_meter_id': '0x12345678',
              'apator_meter_id': '0x87654321',
              'gama350_aes_key': secrets.token_hex(16),
              'apator_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(
              ''.join(f'{k}: "{v}"\n' for k, v in keys.items())
          )
          PY
      - name: Install ESPHome 2026.10.0
        run: python -m pip install 'esphome==2026.10.0'
      - name: Validate and compile v4 example without flashing
        run: |
          esphome config config/wmbus-gama350-v4.yaml
          esphome compile config/wmbus-gama350-v4.yaml
