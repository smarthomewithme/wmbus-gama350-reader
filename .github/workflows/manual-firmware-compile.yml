name: Manual ESPHome config/compile (no flash)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned upstream and candidate patch
        run: bash scripts/prepare_sources.sh
      - name: Install pinned ESPHome
        run: python -m pip install 'esphome==2026.10.0'
      - name: Validate and compile using dummy CI credentials
        run: |
          python - <<'PYTESTKEYS'
          from pathlib import Path
          import base64, secrets
          quote = lambda s: '"' + s + '"'
          data = {
            'wifi_ssid': 'CI-NO-RADIO',
            'wifi_password': secrets.token_urlsafe(24),
            'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode(),
            'ota_password': secrets.token_urlsafe(24),
            'gama350_meter_id': '0x12345678',
            'apator_meter_id': '0x87654321',
            'gama350_aes_key': secrets.token_hex(16),
            'apator_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(''.join(f'{k}: {quote(v)}\n' for k,v in data.items()))
          PYTESTKEYS
          esphome config config/wmbus-gama350.yaml
          esphome compile config/wmbus-gama350.yaml
