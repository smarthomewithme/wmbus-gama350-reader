name: Native tests and upstream patch
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ASan/UBSan and regression fixtures
        run: bash scripts/test.sh
      - name: Confirm patch applies to pinned upstream
        run: bash scripts/prepare_sources.sh
      - name: Enable long-frame diagnostics patch
        run: bash scripts/enable_diagnostics.sh
      - name: Enable stable RXBYTES fix
        run: bash scripts/enable_stable_rxbytes.sh
      - name: Run CC1101 stable RXBYTES fixture
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/rxbytes_stability.cpp -o /tmp/rxbytes-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/rxbytes-test
      - name: Check resulting diff
        run: git -C vendor/upstream diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: python -m pip install 'esphome==2026.10.0'
      - name: Generate isolated CI credentials
        run: |
          python - <<'PYTESTKEYS'
          from pathlib import Path
          import base64, secrets
          quote = lambda s: '"' + s + '"'
          data = {
            'wifi_ssid': 'CI-NO-RADIO',
            'wifi_password': secrets.token_urlsafe(24),
            'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode(),
            'ota_password': secrets.token_urlsafe(24),
            'gama350_meter_id': '0x12345678',
            'apator_meter_id': '0x87654321',
            'gama350_aes_key': secrets.token_hex(16),
            'apator_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(''.join(f'{k}: {quote(v)}\n' for k,v in data.items()))
          PYTESTKEYS
      - name: Validate and compile diagnostic firmware (no flash)
        run: |
          esphome config config/wmbus-gama350.yaml
          esphome compile config/wmbus-gama350.yaml
