name: One-time exact legacy branch removal (preserve main/v4.9/v4.27)
on:
  push:
    branches: [diagnostics/v4.27-v49-passive-observer]
permissions:
  contents: write
jobs:
  prune-explicit-legacy-refs:
    if: github.repository == 'smarthomewithme/wmbus-gama350-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact branch list and old PRs closed, no mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prune_legacy_refs_once.py
      - name: Delete only 34 exact pinned old refs, never main/stable v4.9/new observer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prune_legacy_refs_once.py --execute
