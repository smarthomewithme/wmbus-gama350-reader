name: CC1101 v3 isolated firmware compile (no flash)
on:
  push:
    branches:
      - fix/cc1101-stable-rxbytes-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated_candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated CC1101 v3 sources
        run: bash scripts/prepare_cc1101_v3_isolated.sh
      - name: Verify all patches and unchanged filter
        run: |
          git -C vendor/cc1101_v3 diff --check
          python - <<'PY'
          from pathlib import Path
          src = Path('vendor/cc1101_v3/components/wmbus_radio/transceiver_cc1101.cpp').read_text()
          assert src.count('this->write_register(CC1101_MDMCFG4, 0x5C);') == 1
          assert 'this->write_register(CC1101_MDMCFG4, 0x6C);' not in src
          assert 'unstable_rxbytes=' in src
          assert Path('vendor/cc1101_v3/components/wmbus_radio/cc1101_fifo.h').is_file()
          PY
      - name: Generate v3 CI config and synthetic secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, secrets
          template = Path('config/wmbus-gama350.yaml').read_text()
          before = '../vendor/upstream/components'
          assert template.count(before) == 1
          Path('config/wmbus-gama350-v3.yaml').write_text(
              template.replace(before, '../vendor/cc1101_v3/components')
          )
          creds = {
              'wifi_ssid': 'CI-NO-RADIO',
              'wifi_password': secrets.token_urlsafe(24),
              'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode(),
              'ota_password': secrets.token_urlsafe(24),
              'gama350_meter_id': '0x12345678',
              'apator_meter_id': '0x87654321',
              'gama350_aes_key': secrets.token_hex(16),
              'apator_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(
              ''.join(f'{k}: "{v}"\n' for k, v in creds.items())
          )
          PY
      - name: Install pinned ESPHome
        run: python -m pip install 'esphome==2026.10.0'
      - name: Validate and compile isolated v3 firmware (no flash)
        run: |
          esphome config config/wmbus-gama350-v3.yaml
          esphome compile config/wmbus-gama350-v3.yaml
