name: ESPHome GitHub one-line component install
on:
  push:
    branches: [feature/direct-esphome-install-v4, fix/v4-bootstrap-github-refresh, experiment/v4.1-fifo16, experiment/v4.4-stale-irq-clear, experiment/v4.5-isr-woken-init, experiment/v4.9-stable-marcstate-eof, experiment/v4.10-five-minute-rx-diag, experiment/v4.11-rxbytes65-prefetch, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-direct-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bootstrap source compiles and has no vendor code
        run: |
          python -m compileall -q components
          python - <<'PY'
          from pathlib import Path
          for name in ('wmbus_common', 'wmbus_radio', 'wmbus_meter', 'socket_transmitter'):
              files = [p for p in (Path('components') / name).rglob('*.py') if p.is_file()]
              assert len(files) == 1 and files[0].name == '__init__.py'
          assert 'a732dd0e52c48973fad57e4950a11d8e2f2d6820' in Path('components/_bootstrap_v4.py').read_text()
          PY
      - name: Generate ordinary ESPHome YAML pointing to public GitHub branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import os
          import secrets
          src = Path('config/wmbus-gama350.yaml').read_text()
          needle = '''  - source:
                  type: local
                  path: ../vendor/upstream/components'''
          # Preserve original meter configuration; replace only external source.
          assert src.count('path: ../vendor/upstream/components') == 1
          ref = os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME')
          if not ref or ref.endswith('/merge'):
              raise AssertionError(f'Unexpected GitHub ref: {ref}')
          source = 'github://smarthomewithme/wmbus-gama350-reader@' + ref
          src = src.replace(
              '  - source:\n      type: local\n      path: ../vendor/upstream/components',
              f'  - source: {source}\n    refresh: always'
          )
          assert source in src
          assert '../vendor/upstream/components' not in src
          Path('config/wmbus-gama350-direct.yaml').write_text(src)
          creds = {
              'wifi_ssid': 'CI-NO-RADIO',
              'wifi_password': secrets.token_urlsafe(24),
              'api_encryption_key': base64.b64encode(secrets.token_bytes(32)).decode(),
              'ota_password': secrets.token_urlsafe(24),
              'gama350_meter_id': '0x12345678',
              'apator_meter_id': '0x87654321',
              'gama350_aes_key': secrets.token_hex(16),
              'apator_aes_key': secrets.token_hex(16),
          }
          Path('config/secrets.yaml').write_text(
              ''.join(f'{k}: "{v}"\n' for k, v in creds.items())
          )
          PY
      - name: Install ESPHome 2026.10.0
        run: python -m pip install 'esphome==2026.10.0'
      - name: Regression test for ESPHome cached Github refresh
        run: python tests/test_bootstrap_refresh.py
      - name: Validate using actual GitHub component source (not local vendor)
        run: |
          esphome config config/wmbus-gama350-direct.yaml
      - name: Assert v4.11 RXBYTES=65 handling and preserved v4.10/v4.9 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('config/.esphome')
          matches = list(root.rglob('transceiver_cc1101.cpp'))
          # ESPHome's source cache may live outside project config.
          if not matches:
              matches = list(Path('config').rglob('transceiver_cc1101.cpp'))
          assert matches, 'No prepared CC1101 source found'
          assert any('CC1101_FIFOTHR, 0x03' in p.read_text()
                     and 'SHWM v4.1 FIFO16 experiment' in p.read_text()
                     and 'SHWM v4.9 MARCSTATE EOF confirmation' in p.read_text()
                     and 'confirm_marcstate_eof(' in p.read_text()
                     and 'rx_fifo_count_plausible(available)' in p.read_text()
                     and 'rx_fifo_complete_read(' in p.read_text()
                     for p in matches), [str(p) for p in matches]
          fifo_sources = list(Path('config').rglob('cc1101_fifo.h'))
          assert fifo_sources, 'No prepared FIFO helper found'
          assert any('kCc1101MaxReportedRxBytes = 65' in p.read_text()
                     and 'rx_fifo_complete_read' in p.read_text()
                     for p in fifo_sources)
          radio_sources = list(Path('config').rglob('component.cpp'))
          assert radio_sources, 'No prepared radio component.cpp found'
          assert any('SHWM v4.4 stale IRQ clear' in p.read_text()
                     and 'SHWM v4.10 RX_DIAG_5M' in p.read_text()
                     and '(void) ulTaskNotifyTake(pdTRUE, 0);' in p.read_text()
                     and 'BaseType_t xHigherPriorityTaskWoken = pdFALSE;' in p.read_text()
                     and 'BaseType_t xHigherPriorityTaskWoken;' not in p.read_text()
                     for p in radio_sources), [str(p) for p in radio_sources]
          PY
      - name: Validate a second time with refresh always
        run: |
          esphome config config/wmbus-gama350-direct.yaml
      - name: Compile using actual GitHub component source (no device access)
        run: |
          esphome compile config/wmbus-gama350-direct.yaml
